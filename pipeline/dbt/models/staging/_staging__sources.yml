version: 2

sources:
  - name: raw
    schema: public
    tables:
      - name: raw_events
        description: GitHub Public Events API에서 5분마다 수집한 원본 이벤트.
        columns:
          - name: event_id
            tests:
              - unique
              - not_null
      - name: trending_repos_snapshot
        description: GitHub Search API로 하루 1회 수집한 급상승(신생 인기) 레포 스냅샷 (ADR-004).
        columns:
          - name: repo_name
            tests:
              - not_null
