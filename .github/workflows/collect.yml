name: Collect GitHub events

on:
  # 5분마다 GitHub Events API만 호출해 artifact로 버퍼링하고 DB에는 접속하지 않는다.
  # DB 적재는 1시간마다 ingest.yml이 모아서 처리 — Neon 컴퓨트를 5분마다 깨우면 무료 플랜
  # 컴퓨트 쿼터를 넘기기 때문(ADR-015). 트리거는 ADR-003과 동일하게 외부 cron(cron-job.org).
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_EVENTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/ingest/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/ingest/requirements.txt

      - name: Collect events
        run: python pipeline/ingest/collect.py events.jsonl

      # 이름 prefix(raw-events-)는 ingest.py의 ARTIFACT_PREFIX와 맞춰야 한다.
      # 보존 기간은 raw_events 보존(ADR-013)과 같은 7일 — 쿼터 초과 등으로 적재가 밀려도
      # 이 기간 안에만 풀리면 수집분이 유실되지 않는다
      - uses: actions/upload-artifact@v4
        with:
          name: raw-events-${{ github.run_id }}
          path: events.jsonl
          retention-days: 7
          if-no-files-found: error
