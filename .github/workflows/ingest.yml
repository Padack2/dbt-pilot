name: Ingest & dbt build

on:
  # 5분 주기 트리거는 GitHub Actions의 schedule 이벤트가 고부하 시간대에
  # 수 시간까지 지연/드롭되는 문제(ADR-003)로 인해 외부 cron(cron-job.org)이
  # workflow_dispatch를 호출하는 방식으로 대체함. schedule 블록은 의도적으로 제거.
  workflow_dispatch: {}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # 5분 주기 트리거가 이전 실행보다 먼저 끝나도 겹쳐 돌지 않도록 순차 대기시킴
    # (incremental 모델 + MV refresh가 동시에 두 번 도는 상황 방지)
    concurrency:
      group: ingest-pipeline
      cancel-in-progress: false
    env:
      DATABASE_URL_BATCH: ${{ secrets.DATABASE_URL_BATCH }}
      GITHUB_TOKEN: ${{ secrets.GH_EVENTS_TOKEN }}
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      FAILURE_ALERT_THRESHOLD: "3"
    steps:
      - uses: actions/checkout@v4

      - name: Record start time
        id: timing
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/ingest/requirements.txt
            pipeline/observability/requirements.txt
            pipeline/dbt/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/ingest/requirements.txt -r pipeline/observability/requirements.txt

      - name: Run ingest
        id: ingest
        run: python pipeline/ingest/ingest.py

      - name: Install dbt
        run: pip install -r pipeline/dbt/requirements.txt

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cp pipeline/dbt/profiles.yml.example ~/.dbt/profiles.yml

      # run + test를 의존성 순서대로 실행 - 데이터 품질 테스트 실패 시 하위 MV까지 내려가지 않음
      - name: dbt build
        run: dbt build --project-dir pipeline/dbt --profiles-dir ~/.dbt

      # dbt-postgres의 materialized_view는 설정 변경 시에만 DDL을 적용하고
      # 데이터를 자동 refresh하지 않으므로 CONCURRENTLY refresh를 별도로 트리거
      - name: Refresh materialized views (CONCURRENTLY)
        run: dbt run-operation refresh_materialized_views --project-dir pipeline/dbt --profiles-dir ~/.dbt

      # raw_events는 삭제 로직이 없으면 무한정 커져 Neon 무료 티어 용량을 넘기므로,
      # 이미 precomputed_events/MV 집계가 끝난 7일 이상 지난 원본 이벤트를 정리한다 (ADR-013)
      - name: Prune raw_events older than 7 days
        run: dbt run-operation prune_raw_events --project-dir pipeline/dbt --profiles-dir ~/.dbt

      # precomputed_events도 보존 정책이 없으면 무기한 커지므로 동일하게 7일만 유지 (ADR-014)
      - name: Prune precomputed_events older than 7 days
        run: dbt run-operation prune_precomputed_events --project-dir pipeline/dbt --profiles-dir ~/.dbt

      - name: Record successful run
        if: success()
        run: |
          python pipeline/observability/record_run.py \
            --status success \
            --started-at "${{ steps.timing.outputs.started_at }}" \
            --finished-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rows-ingested "${{ steps.ingest.outputs.rows_ingested }}" \
            --github-run-id "${{ github.run_id }}"

      - name: Extract failure reason
        if: failure()
        id: failure_reason
        run: |
          {
            echo "message<<PIPELINE_EOF"
            python pipeline/observability/extract_failure.py
            echo "PIPELINE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Record failed run
        if: failure()
        env:
          ERROR_MESSAGE: ${{ steps.failure_reason.outputs.message }}
        run: |
          python pipeline/observability/record_run.py \
            --status failure \
            --started-at "${{ steps.timing.outputs.started_at }}" \
            --finished-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rows-ingested "${{ steps.ingest.outputs.rows_ingested }}" \
            --error-message "$ERROR_MESSAGE" \
            --github-run-id "${{ github.run_id }}"

      # 5분 주기 배치라 일시적 오류로도 실패가 잦을 수 있어, 매 실패마다 알리지 않고
      # 연속 실패가 임계값(배수)에 도달했을 때만 Slack으로 알림 (알림 피로 방지)
      - name: Check consecutive failure streak
        if: failure()
        id: alert_check
        run: python pipeline/observability/should_alert.py

      - name: Notify Slack (repeated failures only)
        if: failure() && steps.alert_check.outputs.alert == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ERROR_MESSAGE: ${{ steps.failure_reason.outputs.message }}
          FAILURE_STREAK: ${{ steps.alert_check.outputs.streak }}
        run: python pipeline/observability/notify_slack.py
